[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sagwan"
version = "0.1.0"
description = "사관(Sagwan) — Korean history source analysis assistant powered by Claude"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.92.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
sagwan = "sagwan.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["sagwan"]
